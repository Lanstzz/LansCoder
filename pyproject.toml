[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LansCoder"
version = "1.3.0"
description = "A local Python coding agent with a Textual TUI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lanscoder-core[llm,mcp]==1.3.0",
    "textual",
    "prompt_toolkit",
    "tomlkit",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "trio", "ruff==0.12.0", "black"]

[project.scripts]
lanscoder = "lanscoder.cli:main"

# D7 结构性消除:`lanscoder/` 导入树由 `lanscoder-core` 唯一持有,
# 本薄壳 wheel 不再自带任何包文件(文件零重叠,双 dist 无冲突)。
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 200
target-version = ["py311"]

[tool.ruff]
line-length = 200
target-version = "py311"
