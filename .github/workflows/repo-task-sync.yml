name: Repo task sync

on:
  pull_request:

permissions:
  contents: read

jobs:
  repo-task-sync:
    name: repo-task-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate shared task snapshot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .ai-team/check.mjs --base "$BASE_SHA"
